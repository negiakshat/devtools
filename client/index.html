<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d0c" />
    <meta name="description" content="Fast, free browser utilities for formatting, validating, converting, and debugging developer data." />
    <script>
      (() => {
        try {
          const defaults = { theme: "dark", scale: 100, density: "compact", accent: "standard", motion: "system", sidebarCollapsed: false };
          const saved = JSON.parse(localStorage.getItem("devtools-prefs") || "{}");
          const preferences = { ...defaults, ...saved };
          const theme = preferences.theme === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preferences.theme;
          const reducedMotion = preferences.motion === "reduced" || (preferences.motion === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches);
          const root = document.documentElement;
          root.dataset.theme = theme === "light" ? "light" : "dark";
          root.dataset.themePreference = ["dark", "light", "system"].includes(preferences.theme) ? preferences.theme : "dark";
          root.dataset.scale = [90, 100, 110, 120].includes(preferences.scale) ? String(preferences.scale) : "100";
          root.dataset.density = preferences.density === "comfortable" ? "comfortable" : "compact";
          root.dataset.accent = preferences.accent === "subtle" ? "subtle" : "standard";
          root.dataset.motion = ["system", "full", "reduced"].includes(preferences.motion) ? preferences.motion : "system";
          root.dataset.sidebar = preferences.sidebarCollapsed ? "collapsed" : "expanded";
          root.style.setProperty("--ui-scale", String((root.dataset.scale === "90" ? 90 : root.dataset.scale === "110" ? 110 : root.dataset.scale === "120" ? 120 : 100) / 100));
          root.classList.toggle("dark", root.dataset.theme === "dark");
          root.classList.toggle("reduce-motion", reducedMotion);
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Developer Tools" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Developer Tools — Fast, Free, Local-First Utilities</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
